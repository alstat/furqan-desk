[package]
name = "AyahLab"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "AyahLab"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ayahlab_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2"
base64       = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
typst        = "0.15"
typst-layout = "0.15"
typst-svg    = "0.15"
typst-pdf    = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typstyle-core = "0.15"
once_cell = "1"
dirs      = "5"
reqwest   = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
flate2    = "1"
tar       = "0.4"
tokio     = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
fontdb    = "0.23"
# portable-pty supports Unix (forkpty) and Windows (ConPTY); keep it cross-platform
# so the integrated terminal works on Windows too.
portable-pty = "0.8"

# On Linux/Windows a deep link launches a fresh process; single-instance (with
# the deep-link feature) forwards the URL to the already-running app instead.
# macOS delivers the URL to the running app directly, so it isn't needed there.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# git2 powers the File Explorer's VCS integration (status highlighting +
# .gitignore graying). Available on desktop (macOS/Linux via unix, plus
# Windows); vendored libgit2 keeps the build self-contained on every OS.
[target.'cfg(any(unix, windows))'.dependencies]
git2      = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk         = "0.9"
ndk-sys     = "0.6"
ndk-context = "0.1"
jni         = { version = "0.21", default-features = false }
