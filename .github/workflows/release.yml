name: Release

on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust-targets: ''
          - platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ''
          - platform: macos-latest
            args: --bundles dmg,app --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Download quran_static.db
        run: gh release download data --pattern "quran_static.db" --dir src-tauri/data --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: AyahLab v__VERSION__
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows  | `.exe` (NSIS installer) or `.msi` |
            | macOS | `.app` |
            | Linux | `.AppImage` or `.deb` |

            See the assets below to download and install.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
