name: Update Data Release

on:
  workflow_dispatch:

jobs:
  build-and-upload-db:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install SQLite
        run: sudo apt-get install -y libsqlite3-dev

      # The generator resolves its inputs relative to the working directory,
      # so it must run from src-tauri/. This was the `gen-db/` crate until that
      # duplicate was folded into this example — the two had drifted to
      # different DB_VERSIONs and datasets.
      - name: Build quran_static.db
        working-directory: src-tauri
        run: cargo run --release --example gen-db

      - name: Upload quran_static.db to data release
        run: gh release upload data src-tauri/data/quran_static.db --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
