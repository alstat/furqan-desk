[package]
name = "gen-db"
version = "0.1.0"
edition = "2021"

# Deliberately a standalone crate rather than an example inside src-tauri: an
# example there would implicitly build the app's lib, dragging in Tauri and its
# GTK/WebKit system dependencies. This job only needs SQLite and JSON, so
# keeping it separate lets CI build the dataset without the desktop toolchain.
[[bin]]
name = "gen-db"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde_json = "1"
